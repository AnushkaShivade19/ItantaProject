version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=agentic_framework
      # Note: Make sure your GROQ_API_KEY is in backend/.env
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    volumes:
      # Mount output so generated projects are accessible on the host
      - ./backend/output_projects:/app/output_projects
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  mongo_data:
